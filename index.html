  const [lastId, setLastId] = useState(null); // dernière identification renvoyée par la reconnaissance
  const [catalogue, setCatalogue] = useState(CIGAR_DB); // catalogue affiché (prix éventuellement actualisés via prix.json)
  const [prixMaj, setPrixMaj] = useState(PRIX_MAJ);     // date d'actualisation des prix affichée
  const [errorMsg, setErrorMsg] = useState(null);
  const [imgUrl, setImgUrl] = useState(null);
  const [query, setQuery] = useState("");
  const [saved, setSaved] = useState({});   // fiches corrigées par l'utilisateur (depuis le stockage local)
  const [draft, setDraft] = useState(null);  // fiche en cours d'édition dans le formulaire
  const [scanPhoto, setScanPhoto] = useState(null); // vignette de la dernière photo scannée
  const [indice, setIndice] = useState(""); // indice marque/modèle saisi avant la photo
  const [confirmDelete, setConfirmDelete] = useState(false); // confirmation de suppression de fiche
  const fileRef = useRef(null);
  const importRef = useRef(null);
  const editPhotoRef = useRef(null);

  const STORAGE_KEY = "humidor_fiches_v1";

  // Au démarrage : charger les fiches enregistrées sur cet appareil.
  React.useEffect(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) setSaved(JSON.parse(raw));
    } catch (e) { /* stockage indisponible : on continue sans */ }
  }, []);

  // Charge les prix depuis prix.json (même dossier que l'app) pour actualiser
  // le catalogue SANS toucher au code. Si le fichier est absent ou illisible,
  // on garde simplement les prix intégrés : l'app fonctionne toujours.
  React.useEffect(() => {
    let annule = false;
    fetch("prix.json", { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (annule || !data || !data.prix) return;
        const tarifs = data.prix;
        const next = CIGAR_DB.map((c) => {
          if (!Object.prototype.hasOwnProperty.call(tarifs, c.id)) return c;
          const v = tarifs[c.id];
          const prix = typeof v === "string" ? v : (v && v.prixFR) || null;
          const dispo = !!prix && prix !== "--€";
          return {
            ...c,
            prixFR: dispo ? prix : null,
            dispoFR: dispo,
            prixAlt: dispo ? null : (c.prixAlt || "--€"),
          };
        });
        setCatalogue(next);
        if (data.maj) setPrixMaj(data.maj);
      })
      .catch(() => { /* hors-ligne ou fichier absent : on garde les prix intégrés */ });
    return () => { annule = true; };
  }, []);

  // Enregistre une fiche corrigée (clé = marque+vitole en minuscules).
  // oldKey : si fournie et différente, l'ancienne entrée est retirée (renommage).
  const persistFiche = (fiche, oldKey) => {
    const key = `${fiche.marque}|${fiche.vitole}`.toLowerCase().trim();
    const next = { ...saved };
    if (oldKey && oldKey !== key) delete next[oldKey];
    next[key] = { ...fiche, isUserSaved: true };
    setSaved(next);
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
  };

  // Supprime définitivement une fiche enregistrée (par sa clé marque|vitole).
  const deleteFiche = (fiche) => {
    const key = `${fiche.marque}|${fiche.vitole}`.toLowerCase().trim();
    const next = { ...saved };
    delete next[key];
    setSaved(next);
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
    reset();
  };

  // Télécharge un fichier de sauvegarde (toute la cave + le carnet, photos comprises).
  const exportData = () => {
    try {
      const data = JSON.stringify({ version: 1, date: new Date().toISOString(), fiches: saved }, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `humidor-sauvegarde-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setErrorMsg("La sauvegarde n'a pas pu être créée.");
    }
  };

  // Réimporte un fichier de sauvegarde (fusionne avec l'existant).
  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(String(r.result));
        const incoming = parsed.fiches || parsed; // tolère deux formats
        const merged = { ...saved, ...incoming };
        setSaved(merged);
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        setErrorMsg(null);
        setScreen("home");
      } catch (err) {
        setErrorMsg("Fichier de sauvegarde illisible ou invalide.");
      }
    };
    r.onerror = () => setErrorMsg("Lecture du fichier impossible.");
    r.readAsText(file);
    if (importRef.current) importRef.current.value = "";
  };

  // ⬇️ Une fois le Worker déployé (voir DEPLOIEMENT.md), colle son URL ici.
  // Tant que c'est laissé vide, l'app reste en mode démonstration.
  const WORKER_URL = "https://humidor-worker.humidor-cigares.workers.dev";

  // Cherche d'abord dans les fiches enregistrées par l'utilisateur, puis dans la base maison.
  const lookupSaved = (id) => {
    if (!id || !id.marque) return null;
    const m = id.marque.toLowerCase();
    const v = (id.vitole || "").toLowerCase();
    const vals = Object.values(saved);
    // Correspondance directe UNIQUEMENT si marque ET module concordent.
    // On ne force plus une fiche de cave sur la marque seule : sinon n'importe
    // quel « Rocky Patel » lu rappellerait ton Dark Star enregistré. En cas de
    // module différent, on laisse l'écran de choix proposer la fiche de cave.
    return (
      vals.find((c) => c.marque.toLowerCase().includes(m) && v && c.vitole.toLowerCase().includes(v)) ||
      null
    );
  };

  const filtered = catalogue.filter((c) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return `${c.marque} ${c.vitole} ${c.origine} ${c.gamme}`.toLowerCase().includes(q);
  });

  // Cigares fumés et enregistrés → "Carnet" (dégustations)
  const degustes = Object.values(saved).filter((c) => c.deguste);
  // Cigares enregistrés non encore fumés → "Ma cave" (stock)
  const enStock = Object.values(saved).filter((c) => !c.deguste);

  // Extrait un montant en euros depuis un texte de prix ("13,30 €" → 13.30).
  const parsePrix = (txt) => {
    if (!txt) return 0;
    const m = String(txt).replace(",", ".").match(/(\d+(\.\d+)?)/);
    return m ? parseFloat(m[1]) : 0;
  };
  // Total dépensé = somme des prix des cigares fumés (prix FR, sinon prix US ignoré).
  const totalFume = degustes.reduce((sum, c) => sum + parsePrix(c.prixFR), 0);

  // Recherche + tri appliqués aux listes personnelles (cave / carnet)
  // ── Mon inventaire (stock personnel, saisi a la main) ──
  const INV_KEY = "humidor_inventaire_v1";
  const [monInv, setMonInv] = useState({});   // { id: {nom, marque, pays, format, prixPiece, qte, u} }
  const [invEdit, setInvEdit] = useState(null); // id de la ligne ouverte en edition
  const [libre, setLibre] = useState(null);     // formulaire de saisie libre
  const [enAttenteFumee, setEnAttenteFumee] = useState(null); // cigare en cours de degustation
  const [derniereFumee, setDerniereFumee] = useState(null);   // pour la marche arriere

  // Debite le stock quand la fiche de degustation est reellement enregistree.
  const debiterStock = (ficheKey) => {
    const it = enAttenteFumee;
    if (!it) return;
    const next = { ...monInv };
    if (Number(it.qte) > 1) next[it.id] = { ...it, qte: Number(it.qte) - 1 };
    else delete next[it.id];
    persistInv(next);
    setDerniereFumee({ item: it, ficheKey });   // memorise pour pouvoir revenir en arriere
    setEnAttenteFumee(null);
  };

  // Marche arriere : la fiche repart du carnet, le cigare revient dans l'inventaire.
  const annulerFumee = (info) => {
    if (!info) return;
    const it = info.item;
    const next = { ...monInv };
    next[it.id] = next[it.id] ? { ...next[it.id], qte: (Number(next[it.id].qte) || 0) + 1 } : it;
    persistInv(next);
    if (info.ficheKey) {
      const restant = { ...saved };
      delete restant[info.ficheKey];
      setSaved(restant);
      try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(restant)); } catch (e) {}
    }
    setDerniereFumee(null);
    setResult(null);
    setScreen("inventaire");
  };

  const seedInv = () => {
    const seed = {};
    MON_INVENTAIRE_INIT.forEach((c) => {
      const id = c.nom.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 60);
      seed[id] = { ...c, id };
    });
    return seed;
  };

  React.useEffect(() => {
    try {
      const raw = window.localStorage.getItem(INV_KEY);
      if (raw && Object.keys(JSON.parse(raw)).length) { setMonInv(JSON.parse(raw)); return; }
    } catch (e) { /* stockage indisponible */ }
    const seed = seedInv();          // premier lancement : on charge l'inventaire Excel
    setMonInv(seed);
    try { window.localStorage.setItem(INV_KEY, JSON.stringify(seed)); } catch (e) {}
  }, []);

  // Recharge l'inventaire Excel en fusionnant (les quantites du fichier font foi).
  const reimporterExcel = () => {
    const next = { ...monInv };
    Object.entries(seedInv()).forEach(([id, c]) => {
      next[id] = next[id] ? { ...c, prixPiece: next[id].prixPiece || c.prixPiece } : c;
    });
    persistInv(next);
  };

  const persistInv = (next) => {
    setMonInv(next);
    try { window.localStorage.setItem(INV_KEY, JSON.stringify(next)); } catch (e) {}
  };

  const invId = (nom) => nom.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 60);

  // Ajoute une reference du catalogue a mon inventaire (ou +1 si deja presente).
  const ajouterRef = (c) => {
    const id = invId(c.n);
    const next = { ...monInv };
    if (next[id]) {
      next[id] = { ...next[id], qte: (next[id].qte || 0) + 1 };
    } else {
      next[id] = {
        id, nom: c.n, marque: c.m, pays: c.p, format: c.f,
        prixPiece: c.pu != null ? c.pu : "",   // prix a la piece boutique (CHF) si connu
        prixBoite: c.chf, boite: c.bx, ring: c.rg, longueur: c.lg, u: c.u, qte: 1,
      };
    }
    persistInv(next);
  };

  const majQte = (id, delta) => {
    const it = monInv[id];
    if (!it) return;
    const next = { ...monInv, [id]: { ...it, qte: Math.max(0, (it.qte || 0) + delta) } };
    persistInv(next);
  };
  const majChamp = (id, champ, val) => {
    const it = monInv[id];
    if (!it) return;
    persistInv({ ...monInv, [id]: { ...it, [champ]: val } });
  };
  // « Fumer » : retire un cigare du stock et ouvre une fiche de degustation
  // pre-remplie, que l'enregistrement fera tomber dans le carnet.
  const fumerLigne = (it) => {
    // On ne touche PAS au stock ici : si la fiche est abandonnee, rien n'est perdu.
    // Le debit se fait a l'enregistrement (voir debiterStock).
    setEnAttenteFumee(it);
    const auj = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    const ancienne = Object.values(saved).find(
      (c) => `${c.marque} ${c.vitole}`.toLowerCase().trim() === it.nom.toLowerCase().trim()
    );
    setUnknown(null);
    setResult(null);
    setDraft({
      editId: null, editKey: null,
      marque: it.marqueSrc || (it.marque && it.marque !== "—" ? it.marque : it.nom),
      vitole: it.vitoleSrc
        || (it.marque && it.nom.toLowerCase().startsWith(it.marque.toLowerCase())
              ? it.nom.slice(it.marque.length).trim()
              : "")
        || (it.format && it.format !== "—" ? it.format : "—"),
      origine: it.pays === "Rep. Dominicaine" ? "République Dominicaine" : (it.pays || ""),
      region: "", cape: (ancienne && ancienne.cape !== "—" ? ancienne.cape : ""),
      force: (ancienne && ancienne.force !== "—" ? ancienne.force : ""),
      forceLevel: (ancienne && ancienne.forceLevel) || 0,
      format: it.format && it.format !== "—" ? it.format : "",
      longueur: it.longueur ? String(it.longueur).replace(".", ",") + " cm" : "",
      cepo: it.ring ? String(it.ring) : "",
      duree: (ancienne && ancienne.duree !== "—" ? ancienne.duree : ""),
      prixFR: Number(it.prixPiece) > 0 ? eurDe(Number(it.prixPiece)).replace(" €", "") : "",
      prixUSD: "",
      tripe: (ancienne && ancienne.tripe !== "—" ? ancienne.tripe : ""),
      notes: (ancienne && ancienne.notes && !ancienne.notes.startsWith("Profil non") ? ancienne.notes : ""),
      avis: "", achat: "",
      deguste: true,                 // c'est tout l'interet du bouton
      dateDeguste: auj,
      note: 0, photo: null, accent: "#6B5335",
    });
    setInvEdit(null);
    setScreen("edit");
  };

  const supprimerLigne = (id) => {
    const next = { ...monInv };
    delete next[id];
    persistInv(next);
    setInvEdit(null);
  };

  const monInvListe = Object.values(monInv);
  const totalCigares = monInvListe.reduce((s, it) => s + (Number(it.qte) || 0), 0);
  const valeurTotale = monInvListe.reduce(
    (s, it) => s + (Number(it.qte) || 0) * (Number(it.prixPiece) || 0), 0
  );

  // Filtres appliques a MON inventaire
  const [mesQuery, setMesQuery] = useState("");
  const [mesPays, setMesPays] = useState("");
  const [mesMarque, setMesMarque] = useState("");
  const [mesStockOnly, setMesStockOnly] = useState(false);

  const mesFiltre = monInvListe.filter((it) => {
    if (mesPays && it.pays !== mesPays) return false;
    if (mesMarque && it.marque !== mesMarque) return false;
    if (mesStockOnly && !(Number(it.qte) > 0)) return false;
    const q = mesQuery.trim().toLowerCase();
    if (!q) return true;
    return (it.nom + " " + it.marque + " " + it.pays + " " + (it.format || "")).toLowerCase().includes(q);
  }).sort((a, b) => a.marque.localeCompare(b.marque) || a.nom.localeCompare(b.nom));

  const mesMarquesDispo = Array.from(new Set(monInvListe.map((it) => it.marque))).sort((a, b) => a.localeCompare(b));
  const resetMesFiltres = () => { setMesQuery(""); setMesPays(""); setMesMarque(""); setMesStockOnly(false); };

  // ── Catalogue de reference (lecigare.ch) : sert a la saisie ──
  const [invQuery, setInvQuery] = useState("");
  const [invPays, setInvPays] = useState("");        // "" = tous
  const [invMarque, setInvMarque] = useState("");    // "" = toutes
  const [invStockOnly, setInvStockOnly] = useState(false);
  const [invLimit, setInvLimit] = useState(60);

  const invFiltre = CATALOGUE_REF.filter((c) => {
    if (invPays && c.p !== invPays) return false;
    if (invMarque && c.m !== invMarque) return false;
    if (invStockOnly && c.s !== "in") return false;
    const q = invQuery.trim().toLowerCase();
    if (!q) return true;
    return (c.n + " " + c.m + " " + c.p + " " + c.f).toLowerCase().includes(q);
  });
  const invMarquesDispo = (() => {
    const set = new Set(
      CATALOGUE_REF.filter((c) => (!invPays || c.p === invPays)).map((c) => c.m)
    );
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  })();
  const resetInvFiltres = () => {
    setInvQuery(""); setInvPays(""); setInvMarque(""); setInvStockOnly(false); setInvLimit(60);
  };

  const [caveQuery, setCaveQuery] = useState("");
  const [caveSort, setCaveSort] = useState("recent"); // recent | note | marque | origine

  const applySearchSort = (list, withNote) => {
    const q = caveQuery.trim().toLowerCase();
    let out = list.filter((c) =>
      !q || `${c.marque} ${c.vitole} ${c.origine}`.toLowerCase().includes(q)
    );
    out = [...out].sort((a, b) => {
      if (caveSort === "marque") return a.marque.localeCompare(b.marque);
      if (caveSort === "origine") return (a.origine || "").localeCompare(b.origine || "");
      if (caveSort === "note" && withNote) return (b.note || 0) - (a.note || 0);
      return 0; // "recent" : on garde l'ordre d'insertion
    });
    return out;
  };

  // Statistiques du carnet
  const noteMoyenne = degustes.length
    ? (degustes.reduce((s, c) => s + (c.note || 0), 0) / degustes.filter((c) => c.note).length)
    : 0;
  const origineTop = (() => {
    const counts = {};
    degustes.forEach((c) => { if (c.origine && c.origine !== "Origine indéterminée") counts[c.origine] = (counts[c.origine] || 0) + 1; });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return top ? top[0] : null;
  })();

  // Convertit un fichier image en base64 (sans le préfixe data:)
  const fileToBase64 = (file) =>
    new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });

  // Réduit + compresse une photo en une petite vignette (data URL) pour le stockage local.
  // ~400px de large, qualité 0.7 → quelques dizaines de Ko au lieu de plusieurs Mo.
  const fileToThumb = (file) =>
    new Promise((resolve) => {
      try {
        const r = new FileReader();
        r.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxW = 400;
            const scale = Math.min(1, maxW / img.width);
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.7));
          };
          img.onerror = () => resolve(null);
          img.src = r.result;
        };
        r.onerror = () => resolve(null);
        r.readAsDataURL(file);
      } catch (e) { resolve(null); }
    });

  // Rapproche l'identification du modèle d'une entrée de la base.
  const matchInDb = (id) => {
    if (!id || !id.marque) return null;
    const m = id.marque.toLowerCase();
    const v = (id.vitole || "").toLowerCase();
    // 1) marque + vitole, 2) à défaut marque seule
    return (
      catalogue.find((c) => c.marque.toLowerCase().includes(m) && v && c.vitole.toLowerCase().includes(v)) ||
      catalogue.find((c) => c.marque.toLowerCase().includes(m)) ||
      null
    );
  };

  // ── FIABILITÉ ────────────────────────────────────────────────
  // Normalise un texte (minuscules, sans accents) pour comparer.
  const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

  // Traduit un niveau de confiance (texte libre ou nombre) en score 0..1.
  const confScore = (c) => {
    if (c === undefined || c === null || c === "") return 0.5;
    const s = String(c).toLowerCase();
    const n = parseFloat(s.replace(",", "."));
    if (!isNaN(n)) return n > 1 ? Math.min(1, n / 100) : n; // accepte 0-1, 0-100 ou %
    if (/(haut|élev|elev|fort|sûr|sur|certain|high)/.test(s)) return 0.9;
    if (/(moy|medium|partiel|modér|moder)/.test(s)) return 0.5;
    if (/(faibl|bas|incert|doute|low|aucun)/.test(s)) return 0.2;
    return 0.5;
  };

  // Score de ressemblance entre une fiche et l'identification renvoyée.
  // marque exacte = 5, partielle = 3 ; vitole exacte = 4, partielle = 2 ; origine = 1.
  const scoreCandidate = (c, id) => {
    const m = norm(id.marque), v = norm(id.vitole), o = norm(id.origine);
    const cm = norm(c.marque), cv = norm(c.vitole), co = norm(c.origine);
    let s = 0;
    if (m && cm) {
      if (cm === m) s += 5;
      else if (cm.includes(m) || m.includes(cm)) s += 3;
    }
    if (v && cv && v !== "—") {
      if (cv === v) s += 4;
      else if (cv.includes(v) || v.includes(cv)) s += 2;
    }
    if (o && co && (co.includes(o) || o.includes(co))) s += 1;
    return s;
  };

  // Renvoie les meilleures correspondances (fiches perso prioritaires, puis base maison),
  // dédoublonnées par marque|vitole, triées par score décroissant.
  const rankCandidates = (id, n = 3) => {
    if (!id || !id.marque) return [];
    const pool = [...Object.values(saved), ...catalogue];
    const seen = new Set();
    const uniq = [];
    pool.forEach((c) => {
      const k = `${norm(c.marque)}|${norm(c.vitole)}`;
      if (!seen.has(k)) { seen.add(k); uniq.push(c); }
    });
    const vRead = norm(id.vitole);
    const hasVit = vRead && vRead !== "—";
    return uniq
      .map((c) => ({ c, s: scoreCandidate(c, id) }))
      // Marque au minimum ; et si un module a été lu, on exige AUSSI une
      // concordance de module — sinon une autre vitole de la même marque
      // (ex. ton Dark Star en cave) serait proposée à tort pour un Vintage 1992.
      .filter((x) => {
        if (x.s < 3) return false;
        if (!hasVit) return true;
        const cv = norm(x.c.vitole);
        return cv && (cv.includes(vRead) || vRead.includes(cv));
      })
      .sort((a, b) => b.s - a.s)
      .slice(0, n)
      .map((x) => x.c);
  };

  // Combine les candidats renvoyés par le Worker ET la recherche locale, en
  // privilégiant les fiches de la base (prix français vérifiés), dédoublonnées.
  const resolveCandidates = (id, n = 4) => {
    const readings = [id, ...(Array.isArray(id && id.candidats) ? id.candidats : [])];
    const seen = new Set();
    const out = [];
    readings.forEach((r) => {
      rankCandidates(r, 3).forEach((c) => {
        const k = `${norm(c.marque)}|${norm(c.vitole)}`;
        if (!seen.has(k)) { seen.add(k); out.push(c); }
      });
    });
    return out.slice(0, n);
  };

  // Construit une fiche IA à partir de l'identification renvoyée (aucun prix € inventé).
  const buildAIFiche = (id) => ({
    id: "ai-" + Date.now(),
    marque: id.marque,
    vitole: id.vitole || "—",
    origine: id.origine || "Origine indéterminée",
    region: id.region || id.origine || "—",
    cape: id.cape || "—",
    force: id.force || "—",
    forceLevel: Number.isInteger(id.forceLevel) ? id.forceLevel : 0,
    format: id.format || "—",
    longueur: "—",
    cepo: "—",
    duree: id.duree || "—",
    gamme: "Fiche IA",
    prixFR: null,
    dispoFR: false,
    prixAlt: id.prixUSD ? `${id.prixUSD} (indicatif US)` : "--€",
    notes: id.notes || "Profil non renseigné pour ce cigare.",
    confiance: id.confiance,
    remarque: id.remarque,
    accent: "#6B5335",
    isAI: true,
  });

  // Sélection d'un candidat depuis l'écran de désambiguïsation.
  const pickCandidate = (c) => {
    setCandidates(null);
    setUnknown(null);
    setResult(c);
    setScreen("result");
  };

  const handleCapture = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImgUrl(URL.createObjectURL(file));
    setErrorMsg(null);

    // Génère une vignette compressée, conservée pour l'enregistrement éventuel.
    fileToThumb(file).then((thumb) => setScanPhoto(thumb));

    // Pas de Worker configuré → on reste en démo
    if (!WORKER_URL) {
      runDemo();
      return;
    }

    setScreen("scanning");
    // Délai maximal : sur réseau mobile lent, on n'attend pas indéfiniment.
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 20000);
    try {
      const imageBase64 = await fileToBase64(file);
      let res;
      try {
        res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64, mediaType: file.type || "image/jpeg", indice: indice.trim() }),
          signal: controller.signal,
        });
      } finally {
        clearTimeout(timeoutId);
      }
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.text()).slice(0, 160); } catch (e) {}
        const err = new Error("HTTP " + res.status);
        err.httpStatus = res.status;
        err.httpDetail = detail;
        throw err;
      }
      const id = await res.json();
      setLastId(id);

      // Priorité 1 : une fiche que TU as déjà corrigée/enregistrée sur cet appareil.
      const mine = lookupSaved(id);
      // Meilleures correspondances : candidats du Worker + base maison, classés.
      const cands = resolveCandidates(id, 4);
      const conf = confScore(id && id.confiance);
      const topScore = cands.length ? scoreCandidate(cands[0], id) : 0;
      // Le Worker signale lui-même plusieurs hypothèses → on laisse choisir.
      const workerMultiple = Array.isArray(id && id.candidats) && id.candidats.length > 1;
      const ambiguousVitole =
        workerMultiple || (cands.length >= 2 && scoreCandidate(cands[1], id) >= topScore - 1);

      if (mine && conf >= 0.85) {
        // Fiche perso reconnue avec une bonne confiance → affichage direct.
        setUnknown(null); setCandidates(null);
        setResult(mine);
        setScreen("result");
      } else if (conf >= 0.85 && topScore >= 9 && !ambiguousVitole) {
        // Correspondance marque + module exacte et confiance haute → chemin rapide.
        setUnknown(null); setCandidates(null);
        setResult(cands[0]);
        setScreen("result");
      } else if (cands.length >= 1) {
        // Lecture incertaine OU plusieurs cigares plausibles → on laisse choisir
        // plutôt que d'imposer un résultat peut-être faux.
        setResult(null);
        setUnknown(id);
        setCandidates(cands);
        setScreen("candidates");
      } else if (id && id.marque) {
        // Marque lue mais absente de la base → fiche IA (jamais de prix € inventé).
        setUnknown(null); setCandidates(null);
        setResult(buildAIFiche(id));
        setScreen("result");
      } else {
        // Bague illisible / marque inconnue → écran honnête
        setResult(null);
        setCandidates(null);
        setUnknown(id);
        setScreen("result");
      }
    } catch (err) {
      clearTimeout(timeoutId);
      if (err && err.name === "AbortError") {
        setErrorMsg("La reconnaissance a mis trop de temps à répondre (réseau lent ?). Réessaie.");
      } else if (err && err.httpStatus) {
        // Le serveur a bien repondu : c'est lui qui refuse. On montre quoi.
        setErrorMsg(
          "Le serveur de reconnaissance a répondu HTTP " + err.httpStatus +
          (err.httpDetail ? " — " + err.httpDetail : "") +
          " (le Worker est joignable, c'est son traitement qui échoue : clé API, quota ou image trop lourde)."
        );
      } else {
        setErrorMsg(
          "Le serveur de reconnaissance est injoignable : " + ((err && err.message) || "erreur réseau") +
          ". Réseau coupé, ou requête bloquée côté navigateur (CORS)."
        );
      }
      setScreen("home");
    }
  };

  // Mode démonstration : tire un cigare au hasard (sans appel réseau)
  const runDemo = () => {
    setErrorMsg(null);
    setScreen("scanning");
    setTimeout(() => {
      const pick = catalogue[Math.floor(Math.random() * catalogue.length)];
      setUnknown(null);
      setResult(pick);
      setScreen("result");
    }, 2600);
  };

  const reset = () => {
    setScreen("home");
    setResult(null);
    setUnknown(null);
    setCandidates(null);
    setLastId(null);
    setImgUrl(null);
    setDraft(null);
    setScanPhoto(null);
    setIndice("");
    setConfirmDelete(false);
    if (fileRef.current) fileRef.current.value = "";
  };

  // Ouvre le formulaire vide pour saisir un cigare à la main (sans scan).
  const addManual = () => {
    setResult(null);
    setUnknown(null);
    setScanPhoto(null);
    setDraft({
      editId: null, editKey: null,
      marque: "", vitole: "", origine: "", region: "", cape: "", force: "",
      forceLevel: 0, format: "", longueur: "", cepo: "", duree: "",
      prixFR: "", prixUSD: "", tripe: "", notes: "", avis: "", achat: "",
      deguste: false, dateDeguste: "", note: 0, photo: null, accent: "#6B5335",
    });
    setScreen("edit");
  };

  // Ouvre le formulaire de correction, pré-rempli avec la fiche affichée
  // (qu'elle vienne de l'IA, de la base maison, ou d'un écran "illisible").
  const openEditor = () => {
    const base = result || {};
    setDraft({
      // Si la fiche est déjà une fiche enregistrée par l'utilisateur, on retient
      // son id et sa clé pour l'ÉCRASER au lieu d'en créer une nouvelle.
      editId: base.isUserSaved ? base.id : null,
      editKey: base.isUserSaved ? `${base.marque}|${base.vitole}`.toLowerCase().trim() : null,
      marque: base.marque || (unknown && unknown.marque) || "",
      vitole: base.vitole && base.vitole !== "—" ? base.vitole : "",
      origine: base.origine && base.origine !== "Origine indéterminée" ? base.origine : "",
      region: base.region && base.region !== "—" ? base.region : "",
      cape: base.cape && base.cape !== "—" ? base.cape : "",
      force: base.force && base.force !== "—" ? base.force : "",
      forceLevel: base.forceLevel || 0,
      format: base.format && base.format !== "—" ? base.format : "",
      longueur: base.longueur && base.longueur !== "—" ? base.longueur : "",
      cepo: base.cepo && base.cepo !== "—" ? base.cepo : "",
      duree: base.duree && base.duree !== "—" ? base.duree : "",
      prixFR: base.prixFR || "",
      prixUSD: base.prixUSDraw || "",
      tripe: base.tripe && base.tripe !== "—" ? base.tripe : "",
      notes: base.notes && !base.notes.startsWith("Profil non") ? base.notes : "",
      avis: base.avis || "",
      achat: base.achat || "",
      deguste: base.deguste || false,
      dateDeguste: base.dateDeguste || "",
      note: base.note || 0,
      photo: base.photo || scanPhoto || null,
      accent: base.accent || "#6B5335",
    });
    setScreen("edit");
  };

  const updateDraft = (field, value) => setDraft((d) => ({ ...d, [field]: value }));

  // Photo choisie depuis le formulaire (caméra ou photothèque) → vignette dans le draft.
  const handleEditPhoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const thumb = await fileToThumb(file);
    if (thumb) updateDraft("photo", thumb);
    if (editPhotoRef.current) editPhotoRef.current.value = "";
  };

  // Enregistre la fiche corrigée et l'affiche.
  const saveDraft = () => {
    if (!draft.marque.trim()) return; // la marque est le minimum requis
    const hasFR = draft.prixFR && draft.prixFR.trim() && draft.prixFR.trim() !== "--€";
    const hasUSD = draft.prixUSD && draft.prixUSD.trim();
    const fiche = {
      // On réutilise l'id existant en cas de modification, sinon on en crée un.
      id: draft.editId || ("saved-" + Date.now()),
      marque: draft.marque.trim(),
      vitole: draft.vitole.trim() || "—",
      origine: draft.origine.trim() || "Origine indéterminée",
      region: draft.region.trim() || draft.origine.trim() || "—",
      cape: draft.cape.trim() || "—",
      force: draft.force.trim() || "—",
      forceLevel: Number(draft.forceLevel) || 0,
      format: draft.format.trim() || "—",
      longueur: draft.longueur.trim() || "—",
      cepo: draft.cepo.trim() || "—",
      duree: draft.duree.trim() || "—",
      tripe: draft.tripe.trim() || "—",
      gamme: "Ma fiche",
      prixFR: hasFR ? draft.prixFR.trim() : null,
      dispoFR: hasFR,
      prixUSDraw: hasUSD ? draft.prixUSD.trim() : "",
      prixAlt: hasFR ? null : (hasUSD ? `${draft.prixUSD.trim()} (indicatif US)` : "--€"),
      notes: draft.notes.trim() || "Profil non renseigné.",
      avis: draft.avis.trim() || "",
      achat: draft.achat.trim() || "",
      deguste: !!draft.deguste,
      dateDeguste: draft.deguste ? (draft.dateDeguste.trim() || "") : "",
      note: draft.deguste ? (Number(draft.note) || 0) : 0,
      photo: draft.photo || null,
      accent: draft.accent,
      isUserSaved: true,
    };
    // Si on modifiait une fiche dont la marque/vitole a changé, l'ancienne clé
    // doit être retirée pour ne pas laisser un doublon fantôme.
    const newKey = `${fiche.marque}|${fiche.vitole}`.toLowerCase().trim();
    persistFiche(fiche, draft.editKey && draft.editKey !== newKey ? draft.editKey : null);
    if (enAttenteFumee && fiche.deguste) debiterStock(newKey);
    setResult(fiche);
    setUnknown(null);
    setScreen("result");
  };

  return (
    <div style={styles.app}>
      <style>{globalCss}</style>

      {/* Texture / grain overlay */}
      <div style={styles.grain} />

      {/* HEADER */}
      <header style={styles.header}>
        <div style={styles.brandMark}>
          <span style={styles.brandGlyph}>❦</span>
        </div>
        <div>
          <h1 style={styles.brandName}>HUMIDOR</h1>
          <p style={styles.brandSub}>identification · provenance · prix</p>
        </div>
      </header>

      {/* HOME */}
      {screen === "home" && (
        <main style={styles.main} className="fade-up">
          <div style={styles.heroBlock}>
            <p style={styles.kicker}>Scanner un cigare</p>
            <h2 style={styles.heroTitle}>
              Une photo de la bague.<br />
              <em style={styles.heroEm}>Tout le reste suit.</em>
            </h2>
            <p style={styles.heroText}>
              Pointez la bague du cigare. L'app identifie la marque, le module,
              la provenance et affiche le prix homologué en France.
            </p>
          </div>

          {errorMsg && (
            <div style={styles.errorBanner}>{errorMsg}</div>
          )}

          <div style={styles.indiceWrap}>
            <input
              value={indice}
              onChange={(e) => setIndice(e.target.value)}
              placeholder="Indice (facultatif) : marque ou module connu…"
              style={styles.indiceInput}
            />
            {indice && (
              <button onClick={() => setIndice("")} style={styles.searchClear}><X size={14} /></button>
            )}
          </div>

          <button style={styles.captureBtn} onClick={() => fileRef.current?.click()} className="capture-btn">
            <Camera size={22} strokeWidth={1.6} />
            <span>Prendre une photo</span>
          </button>
          <div style={styles.twinBtnRow}>
            <button style={styles.twinBtn} onClick={addManual} className="demo-btn">
              Ajouter sans scanner
            </button>
            <button style={styles.twinBtn} onClick={runDemo} className="demo-btn">
              Essayer en démo
            </button>
          </div>

          <input
            ref={fileRef}
            type="file"
            accept="image/*"
            onChange={handleCapture}
            style={{ display: "none" }}
          />

          <div style={styles.accessRow}>
            <button style={styles.accessHalf} onClick={() => { resetMesFiltres(); setScreen("inventaire"); }} className="recent-row">
              <Leaf size={17} style={{ color: "#c4a46c" }} />
              <span style={styles.accessHalfLabel}>Inventaire</span>
              <span style={styles.accessHalfCount}>{totalCigares}</span>
            </button>
            <button style={styles.accessHalf} onClick={() => setScreen("carnet")} className="recent-row">
              <Flame size={17} style={{ color: "#c4a46c" }} />
              <span style={styles.accessHalfLabel}>Carnet</span>
              <span style={styles.accessHalfCount}>{degustes.length}</span>
            </button>
          </div>

          <div style={styles.recentBlock}>
            <div style={styles.caveHead}>
              <p style={styles.recentLabel}>Catalogue · {catalogue.length} cigares · prix à jour au {prixMaj}</p>
            </div>
            <div style={styles.searchWrap}>
              <Search size={15} style={{ color: "#7a6a52", flexShrink: 0 }} />
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Marque, origine, gamme…"
                style={styles.searchInput}
              />
              {query && (
                <button onClick={() => setQuery("")} style={styles.searchClear}><X size={14} /></button>
              )}
            </div>
            {filtered.map((c) => (
              <button key={c.id} style={styles.recentRow} onClick={() => { setResult(c); setScreen("result"); }} className="recent-row">
                <span style={{ ...styles.recentDot, background: c.accent }} />
                <span style={styles.recentTextWrap}>
                  <span style={styles.recentName}>{c.marque} <span style={styles.recentVitole}>{c.vitole}</span></span>
                  <span style={styles.recentMeta}>{c.origine} · {c.gamme}</span>
                </span>
                <span style={styles.recentPrice}>{c.dispoFR ? c.prixFR : "hors FR"}</span>
                <ChevronRight size={16} style={{ color: "#6b5d49", flexShrink: 0 }} />
              </button>
            ))}
            {filtered.length === 0 && (
              <p style={styles.noResult}>Aucun cigare ne correspond à « {query} ».</p>
            )}
          </div>

          {/* Sauvegarde */}
          <div style={styles.backupRow}>
            <button style={styles.backupBtn} onClick={exportData} className="demo-btn">Sauvegarder mes données</button>
            <button style={styles.backupBtn} onClick={() => importRef.current?.click()} className="demo-btn">Restaurer</button>
          </div>
          <input
            ref={importRef}
            type="file"
            accept="application/json,.json"
            onChange={importData}
            style={{ display: "none" }}
          />
          <p style={styles.backupHint}>
            Enregistre un fichier de tes fiches et de ton carnet (dans Fichiers ou iCloud) pour les retrouver si tu vides Safari ou changes d'appareil.
          </p>
        </main>
      )}

      {/* SCANNING */}
      {screen === "scanning" && (
        <main style={styles.scanMain}>
          <div style={styles.scanFrame}>
            {imgUrl ? (
              <img src={imgUrl} alt="cigare" style={styles.scanImg} />
            ) : (
              <div style={styles.scanPlaceholder} />
            )}
            <div style={styles.scanLine} className="scan-line" />
            <div style={styles.scanCorner} className="c-tl" />
            <div style={styles.scanCorner} className="c-tr" />
            <div style={styles.scanCorner} className="c-bl" />
            <div style={styles.scanCorner} className="c-br" />
          </div>
          <div style={styles.scanStatus}>
            <Loader2 size={18} className="spin" />
            <span>Lecture de la bague…</span>
          </div>
          <p style={styles.scanHint}>Identification de la marque et du module</p>
        </main>
      )}

      {/* RESULT */}
      {screen === "result" && result && (
        <main style={styles.resultMain} className="fade-up" key={result.id}>
          <button style={styles.closeBtn} onClick={reset} className="close-btn">
            <X size={18} />
          </button>

          <div style={{ ...styles.resultHero, background: `linear-gradient(135deg, ${result.accent}, #2a1d12)` }}>
            {(result.photo || scanPhoto || imgUrl) && (
              <img src={result.photo || scanPhoto || imgUrl} alt={result.marque} style={styles.resultPhoto} />
            )}
            <p style={styles.resultOrigin}>{result.origine}</p>
            <h2 style={styles.resultMarque}>{result.marque}</h2>
            <p style={styles.resultVitole}>{result.vitole}</p>
            <span style={styles.gammeBadge}>{result.gamme}</span>
          </div>

          {/* PRIX */}
          <div style={styles.priceCard}>
            <div>
              <p style={styles.priceLabel}>
                {result.dispoFR ? "Prix homologué France" : "Prix France indisponible"}
              </p>
              <p style={styles.priceValue}>{result.dispoFR ? result.prixFR : result.prixAlt}</p>
              {result.dispoFR && !result.isUserSaved && !result.isAI && (
                <p style={styles.priceDate}>à jour au {prixMaj}</p>
              )}
            </div>
            <Coins size={28} style={{ color: result.accent, opacity: 0.8 }} strokeWidth={1.4} />
          </div>

          {/* STATS */}
          <div style={styles.statGrid}>
            <Stat icon={<MapPin size={16} />} label="Provenance" value={result.region} />
            <Stat icon={<Leaf size={16} />} label="Cape" value={result.cape} />
            <Stat
              icon={<Ruler size={16} />}
              label="Module"
              value={result.isAI
                ? result.format
                : `${result.format} · ${result.longueur} · cepo ${result.cepo}`}
            />
            <Stat icon={<Clock size={16} />} label="Durée" value={result.duree} />
          </div>

          {/* FORCE */}
          <div style={styles.forceBlock}>
            <div style={styles.forceHead}>
              <Flame size={16} style={{ color: result.accent }} />
              <span style={styles.forceLabel}>Force — {result.force}</span>
            </div>
            <div style={styles.forceBar}>
              {[1, 2, 3, 4, 5].map((n) => (
                <span key={n} style={{ ...styles.forcePip, background: n <= result.forceLevel ? result.accent : "#3a2f23" }} />
              ))}
            </div>
          </div>

          {/* NOTES */}
          <div style={styles.notesBlock}>
            <p style={styles.notesLabel}>Profil de dégustation</p>
            <p style={styles.notesText}>{result.notes}</p>
          </div>

          {result.tripe && result.tripe !== "—" && (
            <div style={styles.notesBlock}>
              <p style={styles.notesLabel}>Sous-cape / tripe</p>
              <p style={styles.metaLine}>{result.tripe}</p>
            </div>
          )}

          {result.deguste && (
            <div style={styles.degusteBlock}>
              <p style={styles.notesLabel}>Ma dégustation</p>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <Stars value={result.note} size={22} />
                <span style={styles.noteNum}>{Number(result.note) ? Number(result.note).toFixed(2).replace(/\.?0+$/, "") : "0"} / 5</span>
              </div>
              {result.dateDeguste && <p style={styles.degusteDate}>Fumé le {result.dateDeguste}</p>}
            </div>
          )}

          {result.avis && (
            <div style={styles.avisBlock}>
              <p style={styles.notesLabel}>Mon appréciation</p>
              <p style={styles.notesText}>{result.avis}</p>
            </div>
          )}

          {result.achat && (
            <p style={styles.achatLine}>Acheté : {result.achat}</p>
          )}

          <button style={styles.againBtn} onClick={reset} className="again-btn">
            Scanner un autre cigare
          </button>

          <button style={styles.editBtn} onClick={openEditor} className="demo-btn">
            {result.isUserSaved ? "Modifier cette fiche" : "Corriger / enregistrer cette fiche"}
          </button>

          {result.isUserSaved && (
            confirmDelete ? (
              <div style={styles.deleteConfirm}>
                <p style={styles.deleteConfirmText}>Supprimer définitivement cette fiche ?</p>
                <div style={styles.deleteConfirmRow}>
                  <button style={styles.deleteYes} onClick={() => deleteFiche(result)}>Oui, supprimer</button>
                  <button style={styles.deleteNo} onClick={() => setConfirmDelete(false)}>Annuler</button>
                </div>
              </div>
            ) : (
              <>
                {result.deguste && (
                  <button
                    style={styles.remettreBtn}
                    onClick={() => annulerFumee({
                      item: (derniereFumee && derniereFumee.item) || {
                        id: `${result.marque} ${result.vitole}`.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 60),
                        nom: `${result.marque} ${result.vitole !== "—" ? result.vitole : ""}`.trim(),
                        marque: result.marque, marqueSrc: result.marque, vitoleSrc: result.vitole,
                        pays: result.origine || "Autre", format: result.format || "—",
                        prixPiece: "", prixBoite: null, boite: null,
                        ring: result.cepo !== "—" ? result.cepo : null,
                        longueur: null, u: "", qte: 0,
                      },
                      ficheKey: `${result.marque}|${result.vitole}`.toLowerCase().trim(),
                    })}
                  >Remettre dans l'inventaire</button>
                )}
                <button style={styles.deleteBtn} onClick={() => setConfirmDelete(true)}>Supprimer cette fiche</button>
              </>
            )
          )}

          {result.isUserSaved ? (
            <p style={styles.disclaimer}>
              Fiche enregistrée par tes soins sur cet appareil. C'est elle qui s'affiche en priorité
              quand tu rescannes ce cigare.
            </p>
          ) : result.isAI ? (
            <p style={styles.disclaimer}>
              Fiche établie par reconnaissance, à partir des connaissances générales sur ce cigare
              {result.confiance ? ` · confiance : ${result.confiance}` : ""}. Prix français : « --€ ».
              Si une info est inexacte, corrige-la : ta version sera mémorisée.
            </p>
          ) : (
            <p style={styles.disclaimer}>
              Prix issu des tarifs homologués en France (à jour au {prixMaj}). À actualiser à chaque arrêté du Journal Officiel.
            </p>
          )}
        </main>
      )}

      {/* RESULT — reconnu mais absent de la base */}
      {screen === "result" && !result && unknown && (
        <main style={styles.resultMain} className="fade-up">
          <button style={styles.closeBtn} onClick={reset} className="close-btn">
            <X size={18} />
          </button>

          <div style={{ ...styles.resultHero, background: "linear-gradient(135deg, #3a2c1c, #1a120b)" }}>
            <p style={styles.resultOrigin}>{unknown.origine || "Origine indéterminée"}</p>
            <h2 style={styles.resultMarque}>{unknown.marque || "Bague illisible"}</h2>
            {unknown.vitole && <p style={styles.resultVitole}>{unknown.vitole}</p>}
            <span style={styles.gammeBadge}>Pas encore en base</span>
          </div>

          <div style={styles.unknownCard}>
            <p style={styles.priceLabel}>Ce que la bague indique</p>
            <p style={styles.unknownRead}>{unknown.texte_bague || "—"}</p>
            {unknown.remarque && <p style={styles.unknownNote}>{unknown.remarque}</p>}
            {unknown.confiance && (
              <p style={styles.unknownConf}>Confiance de lecture : {unknown.confiance}</p>
            )}
          </div>

          <p style={styles.disclaimer}>
            La bague n'a pas pu être identifiée avec certitude. Tu peux saisir ce cigare
            toi-même : il sera mémorisé et reconnu lors des prochains scans.
          </p>

          <button style={styles.againBtn} onClick={reset} className="again-btn">
            Scanner un autre cigare
          </button>

          <button style={styles.editBtn} onClick={openEditor} className="demo-btn">
            Saisir ce cigare dans mes fiches
          </button>
        </main>
      )}

      {/* CANDIDATES — désambiguïsation quand le scan est incertain */}
      {screen === "candidates" && candidates && (
        <main style={styles.resultMain} className="fade-up">
          <button style={styles.closeBtn} onClick={reset} className="close-btn">
            <X size={18} />
          </button>

          <div style={{ ...styles.resultHero, background: "linear-gradient(135deg, #3a2c1c, #1a120b)" }}>
            {scanPhoto && <img src={scanPhoto} alt="cigare scanné" style={styles.resultPhoto} />}
            <p style={styles.resultOrigin}>Lecture incertaine</p>
            <h2 style={styles.resultMarque}>Plusieurs correspondances</h2>
            <p style={styles.resultVitole}>Choisis le bon cigare</p>
            {lastId && lastId.confiance && (
              <span style={styles.gammeBadge}>Confiance : {lastId.confiance}</span>
            )}
          </div>

          {lastId && (lastId.texte_bague || lastId.remarque) && (
            <div style={styles.unknownCard}>
              {lastId.texte_bague && (
                <>
                  <p style={styles.priceLabel}>Ce que la bague indique</p>
                  <p style={styles.unknownRead}>{lastId.texte_bague}</p>
                </>
              )}
              {lastId.remarque && <p style={styles.unknownNote}>{lastId.remarque}</p>}
            </div>
          )}

          <p style={styles.candHint}>
            La reconnaissance n'est pas certaine. Voici les cigares les plus proches —
            sélectionne celui qui correspond à ta bague.
          </p>

          <div style={{ padding: "0 24px" }}>
            {candidates.map((c) => (
              <button key={c.id} style={styles.recentRow} onClick={() => pickCandidate(c)} className="recent-row">
                <span style={{ ...styles.recentDot, background: c.accent }} />
                <span style={styles.recentTextWrap}>
                  <span style={styles.recentName}>{c.marque} <span style={styles.recentVitole}>{c.vitole}</span></span>
                  <span style={styles.recentMeta}>{c.origine} · {c.gamme}</span>
                </span>
                <span style={styles.recentPrice}>{c.dispoFR ? c.prixFR : "hors FR"}</span>
                <ChevronRight size={16} style={{ color: "#6b5d49", flexShrink: 0 }} />
              </button>
            ))}
          </div>

          {lastId && lastId.marque && (
            <button
              style={styles.editBtn}
              onClick={() => { setResult(buildAIFiche(lastId)); setUnknown(null); setCandidates(null); setScreen("result"); }}
              className="demo-btn"
            >
              Aucun — utiliser « {lastId.marque} » telle que lue
            </button>
          )}

          <button style={styles.editBtn} onClick={openEditor} className="demo-btn">
            Aucun — saisir le cigare à la main
          </button>

          <button style={styles.againBtn} onClick={reset} className="again-btn">
            Reprendre une photo
          </button>

          <p style={styles.disclaimer}>
            Mieux vaut choisir que deviner : le cigare sélectionné affichera le prix homologué exact.
            Tu peux toujours le corriger ensuite.
          </p>
        </main>
      )}

      {/* EDIT — formulaire de correction / saisie */}
      {screen === "edit" && draft && (
        <main style={styles.editMain} className="fade-up">
          <div style={styles.editHead}>
            <button
              style={styles.closeBtn}
              onClick={() => { const v = enAttenteFumee; setEnAttenteFumee(null); setDraft(null); setScreen(v || !result ? "inventaire" : "result"); }}
              className="close-btn"
            >
              <X size={18} />
            </button>
            <h2 style={styles.editTitle}>Fiche du cigare</h2>
            <p style={styles.editSub}>Corrige ce qui est faux, complète le reste. Seul le nom est obligatoire.</p>
          </div>

          <div style={styles.editForm}>
            {draft.photo ? (
              <div style={styles.editPhotoWrap}>
                <img src={draft.photo} alt="cigare" style={styles.editPhoto} />
                <div style={{ display: "flex", gap: 14, justifyContent: "center" }}>
                  <button style={styles.editPhotoLink} onClick={() => editPhotoRef.current?.click()}>Changer la photo</button>
                  <button style={styles.editPhotoRemove} onClick={() => updateDraft("photo", null)}>Retirer</button>
                </div>
              </div>
            ) : (
              <button style={styles.addPhotoBtn} onClick={() => editPhotoRef.current?.click()} className="demo-btn">
                <Camera size={16} strokeWidth={1.6} />
                <span>Ajouter une photo</span>
              </button>
            )}
            <input
              ref={editPhotoRef}
              type="file"
              accept="image/*"
              onChange={handleEditPhoto}
              style={{ display: "none" }}
            />
            <Field label="Marque *" value={draft.marque} onChange={(v) => updateDraft("marque", v)} placeholder="Ex : Horacio" />
            <Field label="Module / vitole" value={draft.vitole} onChange={(v) => updateDraft("vitole", v)} placeholder="Ex : Grand Toro" />
            <Field label="Pays de production" value={draft.origine} onChange={(v) => updateDraft("origine", v)} placeholder="Ex : Honduras" />
            <Field label="Terroir / région" value={draft.region} onChange={(v) => updateDraft("region", v)} placeholder="Ex : Nicaragua" />
            <Field label="Cape" value={draft.cape} onChange={(v) => updateDraft("cape", v)} placeholder="Ex : Maduro Équateur" />
            <Field label="Force (en mots)" value={draft.force} onChange={(v) => updateDraft("force", v)} placeholder="Ex : Corsée" />

            <div style={styles.fieldBlock}>
              <label style={styles.fieldLabel}>Niveau de force</label>
              <div style={styles.forceBar}>
                {[1, 2, 3, 4, 5].map((n) => (
                  <button
                    key={n}
                    onClick={() => updateDraft("forceLevel", n)}
                    style={{ ...styles.forcePip, cursor: "pointer", border: "none", background: n <= draft.forceLevel ? draft.accent : "#3a2f23" }}
                    aria-label={`force ${n}`}
                  />
                ))}
              </div>
            </div>

            <SelectField label="Format" value={draft.format} onChange={(v) => updateDraft("format", v)} options={FORMATS} placeholder="Format du cigare" />
            <div style={styles.fieldRow}>
              <SelectField label="Longueur" value={draft.longueur} onChange={(v) => updateDraft("longueur", v)} options={LONGUEURS} placeholder="mm ou pouces" half />
              <SelectField label="Bague (cepo)" value={draft.cepo} onChange={(v) => updateDraft("cepo", v)} options={CEPOS} placeholder="ex : 50" half />
            </div>
            <Field label="Durée" value={draft.duree} onChange={(v) => updateDraft("duree", v)} placeholder="60–80 min" />
            <Field label="Sous-cape / tripe" value={draft.tripe} onChange={(v) => updateDraft("tripe", v)} placeholder="Ex : Nicaragua, Honduras" />
            <div style={styles.fieldRow}>
              <Field label="Prix payé en France" value={draft.prixFR} onChange={(v) => updateDraft("prixFR", v)} placeholder="14,50 €" half />
              <Field label="Prix US (indicatif)" value={draft.prixUSD} onChange={(v) => updateDraft("prixUSD", v)} placeholder="~12 $" half />
            </div>
            <Field label="Acheté le / chez (facultatif)" value={draft.achat} onChange={(v) => updateDraft("achat", v)} placeholder="Ex : mars 2026, La Civette" />

            {/* Dégustation */}
            <div style={styles.degusteToggle} onClick={() => updateDraft("deguste", !draft.deguste)}>
              <span style={{ ...styles.checkbox, background: draft.deguste ? "#c4a46c" : "transparent" }}>
                {draft.deguste ? "✓" : ""}
              </span>
              <span style={styles.degusteLabel}>Je l'ai fumé — ajouter à mon carnet</span>
            </div>

            {draft.deguste && (
              <div style={styles.degustePanel}>
                <Field label="Date de dégustation" value={draft.dateDeguste} onChange={(v) => updateDraft("dateDeguste", v)} placeholder="Ex : 30 mai 2026" />
                <div style={styles.fieldBlock}>
                  <label style={styles.fieldLabel}>Ma note — {Number(draft.note) ? Number(draft.note).toFixed(2).replace(/\.?0+$/, "") : "0"} / 5</label>
                  <div style={{ marginBottom: 10 }}><Stars value={draft.note} size={26} /></div>
                  <input
                    type="range"
                    min="0" max="5" step="0.25"
                    value={draft.note || 0}
                    onChange={(e) => updateDraft("note", parseFloat(e.target.value))}
                    style={styles.rangeInput}
                  />
                </div>
              </div>
            )}

            <div style={styles.fieldBlock}>
              <label style={styles.fieldLabel}>Profil de dégustation</label>
              <textarea
                value={draft.notes}
                onChange={(e) => updateDraft("notes", e.target.value)}
                placeholder="Arômes, caractère…"
                style={styles.textarea}
                rows={3}
              />
            </div>

            <div style={styles.fieldBlock}>
              <label style={styles.fieldLabel}>Mon appréciation personnelle</label>
              <textarea
                value={draft.avis}
                onChange={(e) => updateDraft("avis", e.target.value)}
                placeholder="Ce que tu en as pensé, à refumer ou non…"
                style={styles.textarea}
                rows={3}
              />
            </div>
          </div>

          <button
            style={{ ...styles.captureBtn, margin: "8px 24px 0", width: "calc(100% - 48px)", opacity: draft.marque.trim() ? 1 : 0.5 }}
            onClick={saveDraft}
            className="capture-btn"
          >
            {draft.deguste ? "Enregistrer dans mon carnet" : "Enregistrer cette fiche"}
          </button>
          <p style={styles.disclaimer}>
            Enregistré sur cet appareil. {draft.deguste
              ? "Ce cigare rejoint ton carnet de dégustation, avec sa note."
              : "Fiche enregistrée : elle servira à la reconnaissance. Coche « Je l'ai fumé » pour la passer au carnet."}
          </p>
        </main>
      )}

      {/* MON INVENTAIRE — stock personnel, quantités saisies à la main */}
      {screen === "inventaire" && (
        <main style={styles.resultMain} className="fade-up">
          <button style={styles.closeBtn} onClick={reset} className="close-btn">
            <X size={18} />
          </button>

          <div style={styles.caveHeader}>
            <p style={styles.kicker}>Mon stock</p>
            <h2 style={styles.caveTitle}>Inventaire</h2>
            <p style={styles.caveCountLine}>
              {totalCigares} cigare{totalCigares > 1 ? "s" : ""} · {monInvListe.length} référence{monInvListe.length > 1 ? "s" : ""}
              {valeurTotale > 0 ? ` · ${eurDe(valeurTotale)}` : ""}
            </p>
          </div>

          {derniereFumee && (
            <div style={styles.undoBox}>
              <span style={styles.undoText}>
                « {derniereFumee.item.nom} » est passé au carnet.
              </span>
              <button style={styles.undoBtn} onClick={() => annulerFumee(derniereFumee)}>
                Annuler
              </button>
            </div>
          )}

          <div style={{ padding: "4px 24px 0", display: "flex", gap: 8 }}>
            <button style={styles.invAddBtn} onClick={() => { resetInvFiltres(); setScreen("inv_ajout"); }} className="capture-btn">
              + Ajouter depuis le catalogue
            </button>
          </div>
          <div style={{ padding: "8px 24px 0" }}>
            <button
              style={styles.invReset}
              onClick={() => setLibre({ nom: "", marque: "", pays: "Nicaragua", format: "", prixPiece: "", qte: "1" })}
            >Saisie libre (cigare hors catalogue)</button>
            <span style={{ color: "#4d4335", margin: "0 8px" }}>·</span>
            <button style={styles.invReset} onClick={reimporterExcel}>
              Recharger l'inventaire Excel ({MON_INVENTAIRE_INIT.length} réf.)
            </button>
          </div>

          {/* Formulaire de saisie libre */}
          {libre && (
            <div style={styles.libreBox}>
              <Field label="Nom du cigare" value={libre.nom} onChange={(v) => setLibre({ ...libre, nom: v })} placeholder="Ex : Partagas Serie D No.4" />
              <Field label="Marque" value={libre.marque} onChange={(v) => setLibre({ ...libre, marque: v })} placeholder="Ex : Partagas" />
              <div style={styles.fieldBlock}>
                <label style={styles.fieldLabel}>Pays</label>
                <select value={libre.pays} onChange={(e) => setLibre({ ...libre, pays: e.target.value })} style={styles.invSelect}>
                  {[...INV_PAYS, "Cuba", "Autre"].map((p) => <option key={p} value={p}>{p === "Rep. Dominicaine" ? "République Dominicaine" : p}</option>)}
                </select>
              </div>
              <Field label="Format (facultatif)" value={libre.format} onChange={(v) => setLibre({ ...libre, format: v })} placeholder="Ex : Robusto" />
              <Field label="Prix à la pièce en CHF (facultatif)" value={libre.prixPiece} onChange={(v) => setLibre({ ...libre, prixPiece: v })} placeholder="Ex : 12.50" />
              <Field label="Quantité" value={libre.qte} onChange={(v) => setLibre({ ...libre, qte: v })} placeholder="1" />
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button
                  style={{ ...styles.invAddBtn, opacity: libre.nom.trim() ? 1 : 0.5 }}
                  className="capture-btn"
                  onClick={() => {
                    if (!libre.nom.trim()) return;
                    const id = invId(libre.nom);
                    persistInv({ ...monInv, [id]: {
                      id, nom: libre.nom.trim(), marque: libre.marque.trim() || "—",
                      pays: libre.pays, format: libre.format.trim() || "—",
                      prixPiece: libre.prixPiece.replace(",", "."), u: "",
                      qte: Math.max(1, Number(libre.qte) || 1),
                    } });
                    setLibre(null);
                  }}
                >Enregistrer</button>
                <button style={styles.invGhostBtn} onClick={() => setLibre(null)}>Annuler</button>
              </div>
            </div>
          )}

          {monInvListe.length === 0 ? (
            <div style={styles.caveEmpty}>
              <p style={styles.caveEmptyText}>
                Ton inventaire est vide. Ajoute un cigare depuis le catalogue lecigare.ch
                ({CATALOGUE_REF.length} références du Nicaragua, du Honduras et de République
                Dominicaine), puis indique combien tu en as.
              </p>
            </div>
          ) : (
            <>
              {/* Recherche + filtres sur MON inventaire */}
              <div style={{ padding: "14px 24px 0" }}>
                <div style={styles.searchWrap}>
                  <Search size={15} style={{ color: "#7a6a52", flexShrink: 0 }} />
                  <input
                    value={mesQuery}
                    onChange={(e) => setMesQuery(e.target.value)}
                    placeholder="Nom, marque, format…"
                    style={styles.searchInput}
                  />
                  {mesQuery && (
                    <button onClick={() => setMesQuery("")} style={styles.searchClear}><X size={14} /></button>
                  )}
                </div>

                <div style={styles.invChipRow}>
                  {[["", "Tous les pays"], ...INV_PAYS.map((p) => [p, p === "Rep. Dominicaine" ? "Dominicains" : p])].map(([val, lbl]) => (
                    <button
                      key={val || "all"}
                      onClick={() => { setMesPays(val); setMesMarque(""); }}
                      style={{ ...styles.invChip, ...(mesPays === val ? styles.invChipOn : null) }}
                    >{lbl}</button>
                  ))}
                </div>

                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <select value={mesMarque} onChange={(e) => setMesMarque(e.target.value)} style={styles.invSelect}>
                    <option value="">Toutes mes marques ({mesMarquesDispo.length})</option>
                    {mesMarquesDispo.map((m) => <option key={m} value={m}>{m}</option>)}
                  </select>
                  <button
                    onClick={() => setMesStockOnly(!mesStockOnly)}
                    style={{ ...styles.invChip, ...(mesStockOnly ? styles.invChipOn : null), whiteSpace: "nowrap" }}
                  >{mesStockOnly ? "✓ En stock" : "En stock"}</button>
                </div>

                {(mesQuery || mesPays || mesMarque || mesStockOnly) && (
                  <button onClick={resetMesFiltres} style={styles.invReset}>Réinitialiser les filtres</button>
                )}
              </div>

              {/* Mes lignes */}
              <div style={{ padding: "10px 24px 0" }}>
                {mesFiltre.length === 0 && (
                  <p style={styles.noResult}>Aucun cigare de ton inventaire ne correspond.</p>
                )}
                {mesFiltre.map((it) => (
                  <div key={it.id} style={{ ...styles.invCard, opacity: Number(it.qte) > 0 ? 1 : 0.55 }}>
                    <div style={styles.invCardTop}>
                      <span style={styles.invName} onClick={() => setInvEdit(invEdit === it.id ? null : it.id)}>{it.nom}</span>
                      <div style={styles.qteWrap}>
                        <button
                          style={{ ...styles.fumerBtn, opacity: Number(it.qte) > 0 ? 1 : 0.35 }}
                          onClick={() => Number(it.qte) > 0 && fumerLigne(it)}
                          title="Fumer ce cigare et l'ajouter au carnet"
                        >Fumer</button>
                        <button style={styles.qteBtn} onClick={() => majQte(it.id, -1)}>−</button>
                        <span style={styles.qteVal}>{it.qte}</span>
                        <button style={styles.qteBtn} onClick={() => majQte(it.id, +1)}>+</button>
                      </div>
                    </div>
                    <div style={styles.invMeta}>
                      {it.marque} · {it.pays === "Rep. Dominicaine" ? "République Dominicaine" : it.pays}{it.format && it.format !== "—" ? " · " + it.format : ""}{it.longueur ? " · " + String(it.longueur).replace(".", ",") + " cm" : ""}{it.ring ? " · ring " + it.ring : ""}
                    </div>
                    <div style={styles.invPrixRow}>
                      {Number(it.prixPiece) > 0 ? (
                        <>
                          <span style={styles.invEur}>{eurDe(Number(it.prixPiece))}</span>
                          <span style={styles.invChf}>la pièce · {chfDe(Number(it.prixPiece))}</span>
                          {Number(it.qte) > 1 && <span style={styles.invChf}>total {eurDe(Number(it.prixPiece) * Number(it.qte))}</span>}
                        </>
                      ) : (
                        <button style={styles.invReset} onClick={() => setInvEdit(it.id)}>Prix à la pièce à renseigner</button>
                      )}
                      {it.u && (
                        <a href={"https://www.lecigare.ch" + it.u} target="_blank" rel="noopener noreferrer" style={styles.invLink}>Fiche boutique →</a>
                      )}
                    </div>

                    {invEdit === it.id && (
                      <div style={styles.invEditBox}>
                        <Field label="Prix à la pièce en CHF" value={String(it.prixPiece || "")} onChange={(v) => majChamp(it.id, "prixPiece", v.replace(",", "."))} placeholder="Ex : 12.50" />
                        <Field label="Quantité" value={String(it.qte)} onChange={(v) => majChamp(it.id, "qte", Math.max(0, Number(v) || 0))} placeholder="0" />
                        {it.prixBoite ? <p style={styles.invSourceInline}>Relevé boutique : {it.boite ? `boîte de ${it.boite} à ` : ""}{chfDe(Number(it.prixBoite))}{it.boite ? ` — soit ${chfDe(Number(it.prixBoite) / it.boite)} la pièce` : ""}</p> : null}
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                          <button style={styles.invGhostBtn} onClick={() => setInvEdit(null)}>Fermer</button>
                          <button style={{ ...styles.invGhostBtn, color: "#c98b7a", borderColor: "rgba(201,139,122,0.35)" }} onClick={() => supprimerLigne(it.id)}>Retirer de l'inventaire</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </>
          )}

          <button style={styles.againBtn} onClick={reset} className="again-btn">
            Retour à l'accueil
          </button>
        </main>
      )}

      {/* AJOUT — recherche dans le catalogue de référence lecigare.ch */}
      {screen === "inv_ajout" && (
        <main style={styles.resultMain} className="fade-up">
          <button style={styles.closeBtn} onClick={() => setScreen("inventaire")} className="close-btn">
            <X size={18} />
          </button>

          <div style={styles.caveHeader}>
            <p style={styles.kicker}>Catalogue de référence · lecigare.ch</p>
            <h2 style={styles.caveTitle}>Ajouter</h2>
            <p style={styles.caveCountLine}>
              {invFiltre.length} référence{invFiltre.length > 1 ? "s" : ""} sur {CATALOGUE_REF.length}
            </p>
          </div>

          <div style={{ padding: "12px 24px 0" }}>
            <div style={styles.searchWrap}>
              <Search size={15} style={{ color: "#7a6a52", flexShrink: 0 }} />
              <input
                value={invQuery}
                onChange={(e) => { setInvQuery(e.target.value); setInvLimit(40); }}
                placeholder="Nom du cigare, marque, format…"
                style={styles.searchInput}
              />
              {invQuery && (
                <button onClick={() => setInvQuery("")} style={styles.searchClear}><X size={14} /></button>
              )}
            </div>

            <div style={styles.invChipRow}>
              {[["", "Tous les pays"], ...INV_PAYS.map((p) => [p, p === "Rep. Dominicaine" ? "Dominicains" : p])].map(([val, lbl]) => (
                <button
                  key={val || "all"}
                  onClick={() => { setInvPays(val); setInvMarque(""); setInvLimit(40); }}
                  style={{ ...styles.invChip, ...(invPays === val ? styles.invChipOn : null) }}
                >{lbl}</button>
              ))}
            </div>

            <div style={{ marginTop: 8 }}>
              <select
                value={invMarque}
                onChange={(e) => { setInvMarque(e.target.value); setInvLimit(40); }}
                style={{ ...styles.invSelect, width: "100%" }}
              >
                <option value="">Toutes les marques ({invMarquesDispo.length})</option>
                {invMarquesDispo.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
          </div>

          <div style={{ padding: "10px 24px 0" }}>
            {invFiltre.length === 0 && <p style={styles.noResult}>Aucune référence ne correspond.</p>}
            {invFiltre.slice(0, invLimit).map((c, i) => {
              const deja = monInv[invId(c.n)];
              return (
                <div key={c.n + i} style={styles.invCard}>
                  <div style={styles.invCardTop}>
                    <span style={styles.invName}>{c.n}</span>
                    <button style={styles.refAddBtn} onClick={() => ajouterRef(c)}>
                      {deja ? `+1 (${deja.qte})` : "Ajouter"}
                    </button>
                  </div>
                  <div style={styles.invMeta}>
                    {c.m} · {c.p === "Rep. Dominicaine" ? "République Dominicaine" : c.p}{c.f !== "—" ? " · " + c.f : ""}{c.lg ? " · " + String(c.lg).replace(".", ",") + " cm" : ""}{c.rg ? " · ring " + c.rg : ""}
                  </div>
                  <div style={styles.invPrixRow}>
                    {c.pu != null

// Champ à liste déroulante avec option "Autre…" (bascule en saisie libre)
function SelectField({ label, value, onChange, options, placeholder, half }) {
  const isCustom = value && !options.includes(value);
  const [custom, setCustom] = React.useState(isCustom);
  return (
    <div style={{ ...fieldBlockStyle, ...(half ? { flex: 1 } : {}) }}>
      <label style={fieldLabelStyle}>{label}</label>
      {custom ? (
        <div style={{ display: "flex", gap: 6 }}>
          <input
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder}
            style={{ ...fieldInputStyle, flex: 1 }}
            autoFocus
          />
          <button
            onClick={() => { setCustom(false); onChange(""); }}
            style={selectBackStyle}
            title="Revenir à la liste"
          >☰</button>
        </div>
      ) : (
        <select
          value={options.includes(value) ? value : ""}
          onChange={(e) => {
            if (e.target.value === "__autre__") { setCustom(true); onChange(""); }
            else onChange(e.target.value);
          }}
          style={fieldInputStyle}
        >
          <option value="">— choisir —</option>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
          <option value="__autre__">Autre… (saisie libre)</option>
        </select>
      )}
    </div>
  );
}

// Affichage d'étoiles avec remplissage fractionnaire (gère 0,25 / 0,5 / 0,75).
function Stars({ value, size }) {
  const v = Number(value) || 0;
  const px = size || 16;
  return (
    <span style={{ display: "inline-flex", gap: 2 }}>
      {[0, 1, 2, 3, 4].map((i) => {
        const fill = Math.max(0, Math.min(1, v - i)); // portion remplie de cette étoile (0..1)
        return (
          <span key={i} style={{ position: "relative", display: "inline-block", width: px, height: px, lineHeight: `${px}px`, fontSize: px }}>
            <span style={{ color: "#3a2f23" }}>★</span>
            <span style={{ position: "absolute", left: 0, top: 0, width: `${fill * 100}%`, overflow: "hidden", color: "#e7cd92", whiteSpace: "nowrap" }}>★</span>
          </span>
        );
      })}
    </span>
  );
}
